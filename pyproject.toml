[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-price-predictor"
version = "0.1.0"
description = "Offline-capable BTCUSDT 30-minute forecasting pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "torch>=2.2,<3",
  "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
dashboard = ["streamlit>=1.36,<2"]

[project.scripts]
btc-train = "bitcoin_predictor.train:main"
btc-download = "bitcoin_predictor.data_download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
