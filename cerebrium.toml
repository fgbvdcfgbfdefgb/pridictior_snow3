[cerebrium.deployment]
name = "btc-price-predictor-train"
python_version = "3.11"
docker_base_image_url = "debian:bookworm-slim"
include = ["./*", "src/**/*", "data/sample/*"]
exclude = [".git/**", "data/btcusdt_1s/**", "artifacts/**", "tests/**"]

[cerebrium.hardware]
compute = "TURING_T4"
gpu_count = 1
cpu = 8
memory = 8.0
provider = "aws"
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 1
cooldown = 300
replica_concurrency = 1
