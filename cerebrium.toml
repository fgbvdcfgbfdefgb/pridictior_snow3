[cerebrium.deployment]
name = "btc-price-predictor-train"
python_version = "3.11"
docker_base_image_url = "nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04"
include = ["./*", "src/**/*", "data/sample/*"]
exclude = [".git/**", "data/btcusdt_1s/**", "artifacts/**", "tests/**"]

[cerebrium.hardware]
compute = "TURING_T4"
gpu_count = 1
cpu = 8
memory = 10.0
provider = "aws"
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 1
cooldown = 300
replica_concurrency = 1

[cerebrium.dependencies.pip]
numpy = ">=1.26,<3"
pandas = ">=2.1,<3"
pyarrow = ">=15,<22"
torch = ">=2.2,<3"
plotly = ">=5.20,<7"
